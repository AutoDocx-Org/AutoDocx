<div class="template-form-container">
    <div class="header">
        <h1>{{ isEditMode ? 'Edit Template' : 'Create Template' }}</h1>
    </div>

    <div *ngIf="loading" class="loading">Loading...</div>

    <div *ngIf="error" class="error-message">{{ error }}</div>

    <form *ngIf="!loading" (ngSubmit)="save()" class="template-form">
        <div class="form-section">
            <h2>Basic Information</h2>
            
            <div class="form-group">
                <label for="name">Template Name *</label>
                <input 
                    id="name" 
                    type="text" 
                    [(ngModel)]="name" 
                    name="name"
                    placeholder="e.g., Employee Onboarding Form"
                    required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea 
                    id="description" 
                    [(ngModel)]="description" 
                    name="description"
                    placeholder="Brief description of this template"
                    rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="wordFile">Word Document {{ isEditMode ? '(Optional - leave empty to keep existing)' : '*' }}</label>
                <div class="file-input-wrapper">
                    <input 
                        id="wordFile" 
                        type="file" 
                        (change)="onFileSelected($event)"
                        accept=".docx"
                        [required]="!isEditMode">
                    <span class="file-name">{{ wordFileName || 'No file selected' }}</span>
                </div>
                <small>Upload a .docx file with placeholders like {{ '{' }}{{ '{' }}FieldName{{ '}' }}{{ '}' }}</small>
            </div>
        </div>

        <div class="form-section">
            <h2>Template Fields</h2>
            <app-field-builder 
                [fields]="fields" 
                (fieldsChange)="onFieldsChanged($event)">
            </app-field-builder>
        </div>

        <div class="form-actions">
            <button type="button" (click)="cancel()" class="btn-secondary" [disabled]="saving">
                Cancel
            </button>
            <button type="submit" class="btn-primary" [disabled]="saving">
                {{ saving ? 'Saving...' : (isEditMode ? 'Update Template' : 'Create Template') }}
            </button>
        </div>
    </form>
</div>
